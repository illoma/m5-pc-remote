<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ef5f0c"/>
    </linearGradient>
    <radialGradient id="btn" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f0812a"/>
      <stop offset="1" stop-color="#c9540a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="410" cy="280" rx="300" ry="230" fill="url(#glow)"/>

  <!-- wireless hint -->
  <path d="M172,132 C230,150 280,150 322,182" fill="none" stroke="#3d7bfd" stroke-width="2"
        stroke-dasharray="3 6" stroke-linecap="round" opacity="0.45"/>
  <circle cx="150" cy="132" r="22" fill="#3d7bfd"/>
  <path d="M144.6,127.5 L155.4,136.5 L150,141 L150,123 L155.4,127.5 L144.6,136.5"
        fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- device body -->
  <g filter="url(#shadow)">
    <rect x="300" y="60" width="220" height="440" rx="30" fill="url(#body)" stroke="#c24a08" stroke-width="2"/>
    <!-- USB-C -->
    <rect x="388" y="493" width="44" height="9" rx="4.5" fill="#5a2606"/>
    <!-- side buttons -->
    <rect x="517" y="150" width="7" height="40" rx="3.5" fill="#d9560a"/>
    <rect x="296" y="300" width="7" height="34" rx="3.5" fill="#d9560a"/>

    <!-- screen bezel -->
    <rect x="320" y="84" width="180" height="300" rx="12" fill="#0c0c0e"/>
    <!-- LCD -->
    <rect x="330" y="94" width="160" height="280" rx="4" fill="#000000"/>

    <!-- === UI: page MEDIA === -->
    <!-- header -->
    <rect x="330" y="94" width="160" height="36" fill="#9b59b6"/>
    <text x="410" y="118" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">MEDIA</text>
    <text x="484" y="107" fill="#ffffff" font-size="11" text-anchor="end" opacity="0.9">1/5</text>

    <!-- rows -->
    <g font-size="14">
      <text x="342" y="164" fill="#b07cd6" font-weight="700">A</text>
      <text x="380" y="164" fill="#ffffff">Play / Pause</text>

      <text x="342" y="198" fill="#8c8c96" font-weight="700">A long</text>
      <text x="393" y="198" fill="#ffffff">Mute</text>

      <text x="342" y="232" fill="#b07cd6" font-weight="700">B</text>
      <text x="380" y="232" fill="#ffffff">Suivant</text>

      <text x="342" y="266" fill="#8c8c96" font-weight="700">B long</text>
      <text x="393" y="266" fill="#ffffff">Precedent</text>
    </g>

    <!-- footer -->
    <rect x="330" y="356" width="160" height="18" fill="#1c1c20"/>
    <text x="337" y="369" fill="#2ecc71" font-size="11">connecte</text>
    <text x="410" y="369" fill="#8c8c96" font-size="11" text-anchor="middle">A+B=page</text>
    <text x="483" y="369" fill="#8c8c96" font-size="11" text-anchor="end">84%</text>

    <!-- M5 front button -->
    <circle cx="410" cy="435" r="31" fill="url(#btn)" stroke="#a94709" stroke-width="1.5"/>
    <circle cx="410" cy="435" r="31" fill="none" stroke="#ffcfa0" stroke-width="1" opacity="0.35"/>
    <text x="410" y="440" fill="#ffe6cf" font-size="13" font-weight="700" text-anchor="middle" opacity="0.55">M5</text>
  </g>

  <!-- caption -->
  <text x="410" y="536" fill="#9aa0a6" font-size="16" text-anchor="middle">
    M5StickC Plus2 &#183; Bluetooth PC Remote
  </text>
</svg>
