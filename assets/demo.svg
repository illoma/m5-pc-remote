<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
  <title>M5StickC Plus2 BLE Remote — les 5 pages en boucle</title>
  <desc>Animation du M5StickC Plus2 défilant ses 5 pages : Media, Volume, Discord, Slides et Macros.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ef5f0c"/>
    </linearGradient>
    <radialGradient id="btn" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f0812a"/>
      <stop offset="1" stop-color="#c9540a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="lcd"><rect x="330" y="94" width="160" height="280" rx="4"/></clipPath>
  </defs>

  <style>
    .hdr{fill:#fff;font-size:21px;font-weight:700;text-anchor:middle}
    .idx{fill:#fff;font-size:11px;text-anchor:end;opacity:.9}
    .tag{fill:#b07cd6;font-size:14px;font-weight:700}
    .tagl{fill:#8c8c96;font-size:14px;font-weight:700}
    .desc{fill:#fff;font-size:14px}
    .hint{fill:#8c8c96;font-size:13px}
    .pg{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear}
    .p1{animation-name:p1}.p2{animation-name:p2}.p3{animation-name:p3}
    .p4{animation-name:p4}.p5{animation-name:p5}
    .abp{animation:abflash 2.4s infinite}
    @keyframes p1{0%{opacity:1}18%{opacity:1}20%{opacity:0}98%{opacity:0}100%{opacity:1}}
    @keyframes p2{0%{opacity:0}18%{opacity:0}20%{opacity:1}38%{opacity:1}40%{opacity:0}100%{opacity:0}}
    @keyframes p3{0%{opacity:0}38%{opacity:0}40%{opacity:1}58%{opacity:1}60%{opacity:0}100%{opacity:0}}
    @keyframes p4{0%{opacity:0}58%{opacity:0}60%{opacity:1}78%{opacity:1}80%{opacity:0}100%{opacity:0}}
    @keyframes p5{0%{opacity:0}78%{opacity:0}80%{opacity:1}98%{opacity:1}100%{opacity:0}}
    @keyframes abflash{0%{opacity:0}8%{opacity:0}16%{opacity:.95}32%{opacity:0}100%{opacity:0}}
  </style>

  <ellipse cx="410" cy="280" rx="300" ry="230" fill="url(#glow)"/>

  <path d="M172,132 C230,150 280,150 322,182" fill="none" stroke="#3d7bfd" stroke-width="2"
        stroke-dasharray="3 6" stroke-linecap="round" opacity="0.45"/>
  <circle cx="150" cy="132" r="22" fill="#3d7bfd"/>
  <path d="M144.6,127.5 L155.4,136.5 L150,141 L150,123 L155.4,127.5 L144.6,136.5"
        fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="300" y="60" width="220" height="440" rx="30" fill="url(#body)" stroke="#c24a08" stroke-width="2"/>
    <rect x="388" y="493" width="44" height="9" rx="4.5" fill="#5a2606"/>
    <rect x="517" y="150" width="7" height="40" rx="3.5" fill="#d9560a"/>
    <rect x="296" y="300" width="7" height="34" rx="3.5" fill="#d9560a"/>

    <rect x="320" y="84" width="180" height="300" rx="12" fill="#0c0c0e"/>
    <rect x="330" y="94" width="160" height="280" rx="4" fill="#000000"/>

    <!-- pages (clippées à l'écran) -->
    <g clip-path="url(#lcd)">
      <!-- MEDIA -->
      <g class="pg p1">
        <rect x="330" y="94" width="160" height="36" fill="#9b59b6"/>
        <text class="hdr" x="410" y="118">MEDIA</text>
        <text class="idx" x="484" y="107">1/5</text>
        <text class="tag"  x="342" y="164">A</text>      <text class="desc" x="388" y="164">Play / Pause</text>
        <text class="tagl" x="342" y="198">A long</text> <text class="desc" x="388" y="198">Mute</text>
        <text class="tag"  x="342" y="232">B</text>      <text class="desc" x="388" y="232">Suivant</text>
        <text class="tagl" x="342" y="266">B long</text> <text class="desc" x="388" y="266">Precedent</text>
      </g>
      <!-- VOLUME -->
      <g class="pg p2" opacity="0">
        <rect x="330" y="94" width="160" height="36" fill="#9b59b6"/>
        <text class="hdr" x="410" y="118">VOLUME</text>
        <text class="idx" x="484" y="107">2/5</text>
        <text class="tag" x="342" y="164">A</text> <text class="desc" x="388" y="164">Volume +</text>
        <text class="tag" x="342" y="198">B</text> <text class="desc" x="388" y="198">Volume -</text>
        <text class="hint" x="342" y="250">Maintiens pour repeter</text>
      </g>
      <!-- DISCORD -->
      <g class="pg p3" opacity="0">
        <rect x="330" y="94" width="160" height="36" fill="#9b59b6"/>
        <text class="hdr" x="410" y="118">DISCORD</text>
        <text class="idx" x="484" y="107">3/5</text>
        <text class="tag" x="342" y="164">A</text> <text class="desc" x="388" y="164">Mute micro</text>
        <text class="tag" x="342" y="198">B</text> <text class="desc" x="388" y="198">Deafen</text>
        <text class="hint" x="342" y="250">Secoue = mute</text>
      </g>
      <!-- SLIDES -->
      <g class="pg p4" opacity="0">
        <rect x="330" y="94" width="160" height="36" fill="#9b59b6"/>
        <text class="hdr" x="410" y="118">SLIDES</text>
        <text class="idx" x="484" y="107">4/5</text>
        <text class="tag"  x="342" y="164">A</text>      <text class="desc" x="388" y="164">Suivant</text>
        <text class="tagl" x="342" y="198">A long</text> <text class="desc" x="388" y="198">Demarrer</text>
        <text class="tag"  x="342" y="232">B</text>      <text class="desc" x="388" y="232">Precedent</text>
        <text class="tagl" x="342" y="266">B long</text> <text class="desc" x="388" y="266">Quitter</text>
      </g>
      <!-- MACROS -->
      <g class="pg p5" opacity="0">
        <rect x="330" y="94" width="160" height="36" fill="#9b59b6"/>
        <text class="hdr" x="410" y="118">MACROS</text>
        <text class="idx" x="484" y="107">5/5</text>
        <text class="tag"  x="342" y="164">A</text>      <text class="desc" x="388" y="164">Capture ecran</text>
        <text class="tagl" x="342" y="198">A long</text> <text class="desc" x="388" y="198">Bureau</text>
        <text class="tag"  x="342" y="232">B</text>      <text class="desc" x="388" y="232">Verrouiller</text>
        <text class="tagl" x="342" y="266">B long</text> <text class="desc" x="388" y="266">Explorateur</text>
      </g>
    </g>

    <!-- footer (fixe) -->
    <rect x="330" y="356" width="160" height="18" fill="#1c1c20"/>
    <text x="337" y="369" fill="#2ecc71" font-size="11">connecte</text>
    <text x="410" y="369" fill="#8c8c96" font-size="11" text-anchor="middle">A+B=page</text>
    <text x="483" y="369" fill="#8c8c96" font-size="11" text-anchor="end">84%</text>

    <!-- flash A+B au changement de page -->
    <g class="abp">
      <rect x="378" y="384" width="64" height="19" rx="9.5" fill="#1c1c20" stroke="#b07cd6" stroke-width="1.3"/>
      <text x="410" y="397" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">A + B</text>
    </g>

    <!-- bouton M5 -->
    <circle cx="410" cy="435" r="31" fill="url(#btn)" stroke="#a94709" stroke-width="1.5"/>
    <circle cx="410" cy="435" r="31" fill="none" stroke="#ffcfa0" stroke-width="1" opacity="0.35"/>
    <text x="410" y="440" fill="#ffe6cf" font-size="13" font-weight="700" text-anchor="middle" opacity="0.55">M5</text>
  </g>

  <text x="410" y="536" fill="#9aa0a6" font-size="16" text-anchor="middle">M5StickC Plus2 &#183; Bluetooth PC Remote</text>
</svg>
